services:
  db:
    image: ${PROCURE_POSTGRES_IMAGE:-postgres:17-bookworm}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: procure_dev
      POSTGRES_PASSWORD: ${PROCURE_PG_ADMIN_PASSWORD:?set developer PG admin password}
      PROCURE_APP_PASSWORD: ${PROCURE_PG_APP_PASSWORD:?set developer PG app password}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres/01-app-role.sh:/docker-entrypoint-initdb.d/01-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d procure_dev"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres:
